<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ratio-title ratio-desc">
<title id="ratio-title">Eski throughput relative to Redis per workload, with Valkey and Dragonfly</title>
<desc id="ratio-desc">Horizontal bars give the Eski median throughput of each workload divided by the Redis median of the same workload on the same server core; the reference line marks 1.0x, thin whiskers span the Eski minimum to maximum over valid repetitions, and smaller markers place the Valkey and Dragonfly medians on the same scale. GET 64 B, pipeline 1 1.10x †; SET 64 B, pipeline 1 1.14x †; SET and GET 1:1, 64 B, pipeline 1 1.13x †; SET and GET 1:1, 64 B, pipeline 16 excluded: Eski 0 of 4 repetitions valid; GET 1024 B, pipeline 1 1.11x †; HGET, 16 fields of 64 B, pipeline 1 1.09x †; SISMEMBER, 16 members, pipeline 1 1.10x †; ZSCORE, 16 members, pipeline 1 1.08x †.</desc>
<rect width="960" height="380" fill="#1a1a19"/>
<text x="12" y="24" font-size="16" font-weight="600" fill="#f0efec">Throughput relative to Redis on the same server core</text>
<text x="12" y="44" font-size="12" fill="#c3c2b7">Eski median of valid repetitions divided by the Redis median of the same workload; higher is better, 1.0x is Redis</text>
<rect x="12" y="56" width="12" height="12" rx="3" fill="#3987e5"/>
<text x="29" y="66" font-size="11.5" fill="#c3c2b7">Eski median</text>
<path d="M112 62 H128 M112 59 V65 M128 59 V65" stroke="#f0efec" stroke-width="1.5" fill="none"/>
<text x="134" y="66" font-size="11.5" fill="#c3c2b7">Eski min to max</text>
<line x1="240" x2="256" y1="62" y2="62" stroke="#d95926" stroke-width="2"/>
<text x="262" y="66" font-size="11.5" fill="#c3c2b7">Redis median, 1.0x</text>
<circle cx="398" cy="62" r="4.5" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="409" y="66" font-size="11.5" fill="#c3c2b7">Valkey median</text>
<circle cx="522" cy="62" r="4.5" fill="#c98500" stroke="#1a1a19" stroke-width="2"/>
<text x="533" y="66" font-size="11.5" fill="#c3c2b7">Dragonfly median</text>
<line x1="251.0" x2="251.0" y1="82" y2="310" stroke="#383835" stroke-width="1"/>
<text x="251.0" y="324" font-size="10" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">0x</text>
<line x1="348.0" x2="348.0" y1="82" y2="310" stroke="#2c2c2a" stroke-width="1"/>
<text x="348.0" y="324" font-size="10" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">0.2x</text>
<line x1="445.0" x2="445.0" y1="82" y2="310" stroke="#2c2c2a" stroke-width="1"/>
<text x="445.0" y="324" font-size="10" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">0.4x</text>
<line x1="542.0" x2="542.0" y1="82" y2="310" stroke="#2c2c2a" stroke-width="1"/>
<text x="542.0" y="324" font-size="10" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">0.6x</text>
<line x1="639.0" x2="639.0" y1="82" y2="310" stroke="#2c2c2a" stroke-width="1"/>
<text x="639.0" y="324" font-size="10" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">0.8x</text>
<line x1="736.0" x2="736.0" y1="82" y2="310" stroke="#d95926" stroke-width="1.5"/>
<text x="736.0" y="324" font-size="10" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">1x</text>
<line x1="833.0" x2="833.0" y1="82" y2="310" stroke="#2c2c2a" stroke-width="1"/>
<text x="833.0" y="324" font-size="10" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">1.2x</text>
<line x1="930.0" x2="930.0" y1="82" y2="310" stroke="#2c2c2a" stroke-width="1"/>
<text x="930.0" y="324" font-size="10" text-anchor="middle" fill="#898781" style="font-variant-numeric: tabular-nums">1.4x</text>
<text x="239" y="104.0" font-size="12" text-anchor="end" fill="#c3c2b7">GET 64 B, pipeline 1</text>
