<text x="259" y="188.0" font-size="11" fill="#898781">excluded: Eski 0 of 4 repetitions valid</text>
<text x="239" y="216.0" font-size="12" text-anchor="end" fill="#c3c2b7">GET 1024 B, pipeline 1</text>
