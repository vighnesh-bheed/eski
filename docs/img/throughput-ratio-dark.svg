<text x="262" y="66" font-size="11.5" fill="#c3c2b7">Redis median, 1.0x</text>
<circle cx="398" cy="62" r="4.5" fill="#199e70" stroke="#1a1a19" stroke-width="2"/>
<text x="409" y="66" font-size="11.5" fill="#c3c2b7">Valkey median</text>
<circle cx="522" cy="62" r="4.5" fill="#c98500" stroke="#1a1a19" stroke-width="2"/>
<text x="533" y="66" font-size="11.5" fill="#c3c2b7">Dragonfly median</text>
