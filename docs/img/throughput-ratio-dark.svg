<circle cx="552.8" cy="156.0" r="4.5" fill="#c98500" stroke="#1a1a19" stroke-width="2"><title>SET and GET 1:1, 64 B, pipeline 1: Dragonfly 0.62x of the Redis median</title></circle>
<text x="808.9" y="160.0" font-size="11" font-weight="600" fill="#f0efec" style="font-variant-numeric: tabular-nums">1.13x †</text>
