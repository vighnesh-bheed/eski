<circle cx="548.9" cy="212.0" r="4.5" fill="#c98500" stroke="#1a1a19" stroke-width="2"><title>GET 1024 B, pipeline 1: Dragonfly 0.61x of the Redis median</title></circle>
<text x="800.4" y="216.0" font-size="11" font-weight="600" fill="#f0efec" style="font-variant-numeric: tabular-nums">1.11x †</text>
