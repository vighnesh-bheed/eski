<text x="12" y="346" font-size="11" fill="#898781">Intel(R) Core(TM) i7-8750H CPU @ 2.20GHz, run comparison-v1, one server core per engine, 100,000 keys, 32 connections, 60 s timed runs</text>
<text x="12" y="362" font-size="11" fill="#898781">† the load generator limited Eski or Redis in at least one valid repetition, so that ratio is bounded by the client, not by the engines. Excluded cells have no inferred score.</text>
