<line x1="34" x2="276" y1="298" y2="298" stroke="#e1e0d9" stroke-width="1"/>
<text x="34" y="316" font-size="11" font-weight="600" fill="#0b0b0b">Reading the diagram</text>
<text x="34" y="332" font-size="10.5" fill="#52514e">Filled boxes are the per-request path on the coordinator.</text>
<text x="34" y="346" font-size="10.5" fill="#52514e">Dashed boxes are worker threads, disabled by default.</text>
<text x="34" y="360" font-size="10.5" fill="#52514e">Below the frame, work leaves the coordinator thread.</text>
<text x="34" y="400" font-size="10.5" fill="#898781">Scratch allocations end with the event-loop iteration; keyspace values, queued work and connection state use owned storage.</text>
<text x="34" y="414" font-size="10.5" fill="#898781">Expiry, keyspace growth and member-table migration run in bounded steps. Modules, replication, Sentinel and Cluster are outside the node.</text>
<text x="34" y="428" font-size="10.5" fill="#898781">docs/architecture.md and docs/threading.md give the details.</text>
</svg>
