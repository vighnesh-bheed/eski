<text x="440.0" y="335.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52514e">immutable snapshots and a</text>
<text x="440.0" y="349.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52514e">private workspace per job</text>
<path d="M480.0 129.0 L480.0 299.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#tail)"/>
<text x="488" y="262" font-size="10" fill="#898781">snapshots down,</text>
<text x="488" y="274" font-size="10" fill="#898781">completion up</text>
