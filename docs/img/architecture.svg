<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="960" height="436" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Eski request path: coordinator loop, keyspace table, optional workers, Lua engines and persistence</title>
<desc id="arch-desc">TCP connections feed per-connection buffers, the RESP parser and dispatch with arity, ACL and key checks; handlers work on the keyspace table of control bytes, slots and inline, slab or heap values, and the typed reply writer fills output buffers that drain back to the connection. Mutations raise effects for watches, notifications, tracking, MONITOR and the AOF feed. Lua 5.1.5 engines run on the coordinator behind a protected C ABI. Optional keyspace workers execute owned values and publish through a coordinator barrier, optional LCS compute workers run over immutable snapshots, and RDB and AOF persistence run their background work in a forked child.</desc>
