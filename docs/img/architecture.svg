<text x="646" y="186" font-size="10" fill="#898781">ordered</text>
<rect x="340" y="300" width="200" height="62" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5" stroke-dasharray="5 3"/>
