<text x="805.0" y="208.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52514e">watches, notifications, tracking,</text>
<text x="805.0" y="222.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#52514e">MONITOR and the AOF feed</text>
