<rect x="170" y="176" width="230" height="56" rx="6" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="285.0" y="194.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Lua 5.1.5 engines on the coordinator</text>
